
name: gov_view
type: VIRTUAL_DATASET
path: ["dremio", "gov_view"]
sql: "SELECT 1"
access_control:
  roles:
    - name: "admin_role"
      privileges: ["SELECT", "ALTER"]
  users:
    - name: "bob@example.com"
      privileges: ["SELECT"]
governance:
  row_access_policy:
    name: "region_filter"
    args: ["region"]
  masking_policies:
    - column: "salary"
      name: "mask_num"
